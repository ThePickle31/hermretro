<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__ROUND__</title>
<style>
:root { --bg: #0d0f13; --panel: #161a21; --line: #262c36; --fg: #e7ecf3; --mut: #8b95a5; --acc: #4c8dff; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .3px; }
.group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.group b { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: 1px; margin-right: 2px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
main { padding: 8px 20px 40px; }
section { margin-top: 22px; }
section h2 { font-size: 14px; margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }
.tag { font: 700 12px ui-monospace, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; }
figure:hover, figure:focus-visible { border-color: var(--acc); outline: none; }
figure img { display: block; width: 100%; height: auto; }
figcaption { padding: 7px 10px; font-size: 12px; color: var(--mut); }
#viewer { position: fixed; inset: 0; z-index: 5; background: rgba(5, 6, 9, .96); display: none; }
#viewer.open { display: block; }
#stage { position: absolute; inset: 44px 0 0; overflow: hidden; cursor: grab; }
#stage.drag { cursor: grabbing; }
#stage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: auto; user-select: none; -webkit-user-drag: none; }
#bar { position: absolute; inset: 0 0 auto; height: 44px; background: var(--bg); display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); }
#bar .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bar button { background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.count { color: var(--mut); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>__ROUND__</h1>
  <div class="group" data-key="mockup"><b>Mockup</b></div>
  <div class="group" data-key="state"><b>State</b></div>
  <div class="group" data-key="width"><b>Width</b></div>
  <div class="group" data-key="theme"><b>Theme</b></div>
</header>
<main id="grid"></main>
<div id="viewer" role="dialog" aria-modal="true">
  <div id="bar">
    <button id="prev" aria-label="Previous">←</button>
    <button id="next" aria-label="Next">→</button>
    <span class="title" id="caption"></span>
    <span class="count" id="count"></span>
    <button id="fit">Fit</button>
    <button id="actual">100%</button>
    <button id="close" aria-label="Close">✕</button>
  </div>
  <div id="stage"><img id="big" alt=""></div>
</div>
<script>
const SHOTS = __DATA__
const filters = { mockup: 'all', state: 'all', width: 'all', theme: 'all' }
const unique = key => [...new Set(SHOTS.map(shot => String(shot[key])))]
const name = shot => `${shot.label} · ${shot.title}`
const detail = shot => `${shot.state} · ${shot.width} · ${shot.theme}`
let visible = []
let index = 0
const view = { scale: 1, x: 0, y: 0 }

for (const group of document.querySelectorAll('.group')) {
  const key = group.dataset.key
  const values = key === 'mockup' ? [...new Set(SHOTS.map(shot => shot.mockup))] : unique(key)
  if (values.length < 2) { group.hidden = true; continue }
  for (const value of ['all', ...values]) {
    const chip = document.createElement('button')
    chip.className = 'chip'
    const shot = SHOTS.find(item => item.mockup === value)
    chip.textContent = value === 'all' ? 'All' : key === 'mockup' ? shot.label : value
    if (key === 'mockup' && shot) chip.title = shot.title
    chip.setAttribute('aria-pressed', String(filters[key] === value))
    chip.onclick = () => {
      filters[key] = value
      for (const other of group.querySelectorAll('.chip')) other.setAttribute('aria-pressed', String(other === chip))
      render()
    }
    group.append(chip)
  }
}

function render() {
  const order = [...new Set(SHOTS.map(shot => shot.mockup))]
  // In the order they are shown: by mockup, then as shot (state, theme, width).
  visible = SHOTS.filter(shot => Object.entries(filters).every(([key, value]) => value === 'all' || String(shot[key]) === value))
    .sort((a, b) => order.indexOf(a.mockup) - order.indexOf(b.mockup) || SHOTS.indexOf(a) - SHOTS.indexOf(b))
  const grid = document.getElementById('grid')
  grid.replaceChildren()
  for (const mockup of [...new Set(visible.map(shot => shot.mockup))]) {
    const shots = visible.filter(shot => shot.mockup === mockup)
    const section = document.createElement('section')
    section.innerHTML = '<h2><span class="tag"></span><span></span></h2><div class="row"></div>'
    section.querySelector('.tag').textContent = shots[0].label
    section.querySelector('h2 span:last-child').textContent = shots[0].title
    for (const shot of shots) {
      const figure = document.createElement('figure')
      figure.innerHTML = '<img loading="lazy" alt=""><figcaption></figcaption>'
      figure.querySelector('img').src = shot.src
      figure.querySelector('figcaption').textContent = detail(shot)
      figure.tabIndex = 0
      figure.onclick = () => open(visible.indexOf(shot))
      figure.onkeydown = event => (event.key === 'Enter' || event.key === ' ') && (event.preventDefault(), open(visible.indexOf(shot)))
      section.querySelector('.row').append(figure)
    }
    grid.append(section)
  }
}

const viewer = document.getElementById('viewer')
const stage = document.getElementById('stage')
const big = document.getElementById('big')
const place = () => { big.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})` }
function fit() {
  const box = stage.getBoundingClientRect()
  view.scale = Math.min(box.width / big.naturalWidth, box.height / big.naturalHeight, 1)
  view.x = (box.width - big.naturalWidth * view.scale) / 2
  view.y = (box.height - big.naturalHeight * view.scale) / 2
  place()
}
function zoomAt(scale, clientX, clientY) {
  const box = stage.getBoundingClientRect()
  const px = clientX - box.left
  const py = clientY - box.top
  const next = Math.min(8, Math.max(0.1, scale))
  view.x = px - ((px - view.x) / view.scale) * next
  view.y = py - ((py - view.y) / view.scale) * next
  view.scale = next
  place()
}
function open(at) {
  index = (at + visible.length) % visible.length
  const shot = visible[index]
  document.getElementById('caption').textContent = `${name(shot)} — ${detail(shot)}`
  document.getElementById('count').textContent = `${index + 1} / ${visible.length}`
  big.onload = fit
  big.src = shot.src
  viewer.classList.add('open')
}
const close = () => viewer.classList.remove('open')
document.getElementById('prev').onclick = () => open(index - 1)
document.getElementById('next').onclick = () => open(index + 1)
document.getElementById('close').onclick = close
document.getElementById('fit').onclick = fit
document.getElementById('actual').onclick = () => { const box = stage.getBoundingClientRect(); zoomAt(1, box.left + box.width / 2, box.top + box.height / 2) }
stage.addEventListener('wheel', event => { event.preventDefault(); zoomAt(view.scale * Math.exp(-event.deltaY / 400), event.clientX, event.clientY) }, { passive: false })
stage.addEventListener('dblclick', event => (view.scale < 0.99 ? zoomAt(1, event.clientX, event.clientY) : fit()))
let drag = null
stage.addEventListener('pointerdown', event => { drag = { x: event.clientX - view.x, y: event.clientY - view.y }; stage.classList.add('drag'); stage.setPointerCapture(event.pointerId) })
stage.addEventListener('pointermove', event => { if (drag) { view.x = event.clientX - drag.x; view.y = event.clientY - drag.y; place() } })
stage.addEventListener('pointerup', () => { drag = null; stage.classList.remove('drag') })
addEventListener('resize', () => viewer.classList.contains('open') && fit())
addEventListener('keydown', event => {
  if (!viewer.classList.contains('open')) return
  if (event.key === 'Escape') close()
  else if (event.key === 'ArrowLeft') open(index - 1)
  else if (event.key === 'ArrowRight') open(index + 1)
  else if (event.key === '0') fit()
  else if (event.key === '+' || event.key === '=') { const box = stage.getBoundingClientRect(); zoomAt(view.scale * 1.25, box.left + box.width / 2, box.top + box.height / 2) }
  else if (event.key === '-') { const box = stage.getBoundingClientRect(); zoomAt(view.scale / 1.25, box.left + box.width / 2, box.top + box.height / 2) }
})
render()
</script>
</body>
</html>
