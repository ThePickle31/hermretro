# retrodev's rules for this repository (committed; the same for everyone). Personal settings go in
# <git common dir>/retrodev/config.toml, never committed: python tools/retrodev config set <key> <value>.
# Patterns are fnmatch over repository paths, where * also matches /.

[config]
# Defaults of the personal settings (the only keys `config set` accepts).
base = "dev"            # the branch pull requests go into and worktrees start from
remote = "origin"
worktree_root = ""      # empty: <main checkout's parent>/<main checkout's name>-wt; a worktree is <root>/<topic>
github_account = ""     # when set, doctor checks gh is logged in as this account
review_profile = ""     # personal, no default: the Hermes profile the reviewer runs from (empty: reviews skipped)
review_provider = "openai-codex"
review_model = "gpt-6.1-sol"
review_reasoning = "high"
mac_host = ""           # personal, no default: the ssh host of a MacBook for `mac` (empty: CI's macOS runners cover it)
mac_repo = "~/Projects/hermretro"  # the clone on the mac (~ is expanded there)

[branches]
kinds = ["feat", "fix", "docs", "chore"]
# Kinds that may start without an approved plan, with --no-plan (small changes).
no_plan = ["docs", "chore"]
protected = ["dev", "main", "master"]

[setup]
# Run once in a new worktree by `start` ({python} is the Python running retrodev).
commands = [
  ["npm", "ci", "--prefix", "tools/npm", "--ignore-scripts", "--no-audit", "--no-fund"],
  ["{python}", "tools/py/setup.py"],
]

[checks]
fast = ["unit", "bundle", "lint", "page", "scan"]
# May be skipped (the tool it needs is not on this machine) without blocking ship: CI runs it on Linux and macOS.
may_skip = ["acceptance"]

[checks.inputs]
# A check reruns only when a file it reads changed since its last pass on the branch: its sources, the tools it
# runs and their pins, and what runs and decides every check (tools/check.py, this file).
lint = ["*.py", "page/*", "tools/bundle/*", "tools/py/*", "tools/npm/package.json", "tools/npm/package-lock.json",
        "tools/check.py", "tools/retrodev/policy.toml"]
bundle = ["page/*", "backend/*/rpcs.py", "tools/bundle/*", "tools/npm/package.json", "tools/npm/package-lock.json",
          "tools/check.py", "tools/retrodev/policy.toml"]
page = ["page/*", "tests/page/*", "tools/bundle/*", "desktop/*", "player/frame-shim.js", "tools/npm/package.json",
        "tools/npm/package-lock.json", "tools/check.py", "tools/retrodev/policy.toml"]
unit = ["*"]
scan = ["*"]
scaffold = ["*"]
acceptance = ["*"]
clean_install = ["*"]
update = ["*"]

[checks.triggers]
# Added to `check` automatically when the branch changed one of these files since it left the base branch.
acceptance = ["backend/*", "engine/*", "player/*", "tools/ci/prepare_toolchain.py", "plugin.yaml"]
# `retrodev new` on a copy of the tree (a few seconds, so not in the fast unit run): its code, its templates and the
# files whose structure it parses. Not docs/dev/ARCHITECTURE.md or CONTRACT.md: `new` itself adds their rows, so
# every branch that used it would pay for the scaffold check.
scaffold = ["tools/retrodev/scaffold*", "tools/retrodev/templates/*", "tests/retrodev/test_scaffold_tree.py",
            "backend/features.py", "tools/layout.toml", "page/pages/index.js",
            "page/pages/build/transcript/step-words.js"]
clean_install = ["__init__.py", "plugin.yaml", "backend/features.py", "backend/hermes/*", "skills/*"]

[checks.budgets]
# Seconds, from measured cold runs on a loaded machine (the fresh-agent trials: unit took up to about 40 s, the
# fast checks together up to about 55 s, scaffold up to about 25 s). A check over its budget twice in a row on the
# branch is named in a warning that it was slower than usual (never a failure: machines and load differ).
fast_total = 60
unit = 45
lint = 15
scan = 30
scaffold = 30
default = 15
acceptance = 240
clean_install = 120
update = 180

[new]
# Features whose modules stay stdlib-only (tests/repo/test_broker_imports.py; system is the bottom layer in
# tests/repo/test_boundaries.py): `new rpc|tool|event` refuses them, as their generated modules import backend.hermes
# or backend.system.events. Their gateway-side pieces belong in a feature such as setup or library.
stdlib_only = ["broker", "system"]

[gc]
# Ignored files gc may delete with a finished worktree: caches that are rebuilt on demand (a folder pattern ends in
# /; a pattern matches the whole path or its last part). Any other ignored file (notes/, games/, scratch/, logs)
# keeps the worktree and its branch: removing the worktree would delete it.
caches = ["node_modules/", ".dev/", "__pycache__/", "*.pyc", "*.pyo", ".ruff_cache/", ".pytest_cache/"]

[generated]
# Files built from sources. sync takes the base branch's side on a conflict in them, then rebuilds them.
files = ["desktop/plugin.js", "player/frame-shim.js", "page/app/rpc-names.js", "tests/repo/registration.json"]
regenerate = [
  ["node", "tools/bundle/bundle.mjs"],
  ["{python}", "tests/repo/test_registration_snapshot.py", "--write"],
]

[ship]
# Every section of .github/pull_request_template.md must have content.
sections = ["Why", "What changed", "How verified", "Risk and rollback", "Not done"]

[labels]
# Pull request labels from the areas a change touches (hardware is never automatic).
backend = ["backend/*", "__init__.py", "plugin.yaml"]
page = ["page/*", "desktop/*", "player/frame-shim.js"]
engine = ["engine/*"]
# .github/'s Markdown (CONTRIBUTING, SECURITY, CODE_OF_CONDUCT, the pull request template) is documentation, not CI.
ci = [".github/*.yml", ".github/*.yaml", ".github/actions/*", "tools/*"]
documentation = [".github/*.md", "docs/*"]

[land]
# land merges only on green CI for the pull request's exact head: every job must pass or be skipped, except these
# (names as gh pr checks prints them), and the required ones must be there (no jobs yet is still waiting).
required_jobs = ["All checks pass"]
ignore_jobs = []
ci_poll = 20            # seconds between CI polls
ci_timeout = 1500       # default --ci-timeout: then land stops with 2 (still waiting; run land again)
# Commits the reviewer is told to skip (subject patterns, fnmatch): a formatter pass, generated output.
mechanical = ["Format*", "*(no code changes)*"]
# A head that only merged dev after its review (sync) keeps the review when its merge resolution changed at most
# this many lines beyond git's own merge (generated files aside); recorded and shown by summary. More: reviewed.
max_sync_resolution_lines = 20

[restart]
# What the owner must do after the change lands in a checkout Hermes loads.
gateway = ["backend/*", "__init__.py", "plugin.yaml", "skills/*", "profile/*"]
app = ["desktop/plugin.js"]
