# Keeps the pinned GitHub Actions current; its pull requests go to dev like everyone else's.
# The dev tools in tools/npm are updated by hand: esbuild's version is recorded in the generated page
# bundle, so it moves only together with Hermes Desktop's. Security-update pull requests for tools/npm may
# open against main: close them and redo the bump on a branch from dev.
#
# The engine (engine) is hash-pinned (engine/contract/manifest.json) and its dependencies
# change only by hand, as an engine change: Dependabot opens no pull requests for it, security ones included (ignore "*"
# applies to both). Its alerts stay visible; accepted ones are explained in .github/SECURITY.md. tools/engine/npm, the
# tools that build the engine's bundle, holds the same packages at the same versions (tests/repo/test_engine_bundle.py)
# and moves with the engine, so it gets no pull requests either.
version: 2
updates:
  - package-ecosystem: npm
    directory: /engine
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: npm
    directory: /tools/engine/npm
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
