# How GitHub groups a release's generated notes (gh release create vX.Y.Z --generate-notes, as tools/release.py
# runs it). Each line is a squash-merged pull request's title: `type(scope): what it does`.
changelog:
  exclude:
    labels: [skip-release-notes]
  categories:
    - title: Dependency updates
      labels: [dependencies]
    - title: Changes
      labels: ["*"]
