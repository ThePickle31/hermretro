# The real engine, compiler and emulator: installs the game toolchain the way the hermretro page does (cached
# between runs) and runs the broker acceptance suite. Called by ci.yml (pull requests that touch the backend or
# the engine, every push to dev) and by nightly.yml. No hardware is ever touched. Locally:
#   python tools/ci/prepare_toolchain.py && python tools/check.py acceptance

name: Integration

on:
  workflow_call:
    inputs:
      systems:
        description: JSON list of runner labels
        type: string
        default: '["ubuntu-latest", "macos-latest"]'
      ref:
        description: Branch or commit to test (empty = the commit that triggered the run)
        type: string
        default: ""
      restore:
        description: Start from the cached toolchain (false = a cold install)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  acceptance:
    name: Broker acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.systems) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The installed toolchain (about 2.4 GB per system), keyed by the engine's setup scripts and the baseline: a
      # new pin, setup change or engine version installs afresh. Saved only from dev and main after an install,
      # so pull requests never crowd the cache (they restore dev's; main's runs restore main's). Bump v1 to throw a
      # bad cache away.
      - name: Toolchain cache key
        id: key
        run: echo "key=toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/scripts/**', 'engine/contract/**', 'backend/setup/provision.py', 'backend/setup/progress.py') }}" >> "$GITHUB_OUTPUT"
      - id: toolchain
        if: inputs.restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hermes/hermretro/.cache/toolchain
          key: ${{ steps.key.outputs.key }}
      - name: python tools/ci/prepare_toolchain.py
        run: python tools/ci/prepare_toolchain.py
      - if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.toolchain.outputs.cache-hit != 'true'
        continue-on-error: true  # the key may already exist on this branch (a cold nightly)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hermes/hermretro/.cache/toolchain
          key: ${{ steps.key.outputs.key }}
      - name: python tools/check.py acceptance
        run: python tools/check.py acceptance --strict
      - name: Keep the evidence of a failed or cancelled run
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            notes/evidence/
            /tmp/hermretro-prepare-*/*.jsonl
            /tmp/hermretro-prepare-*/*.log
            ~/.hermes/hermretro/.cache/toolchain/last-run.json
          if-no-files-found: ignore
          retention-days: 14
