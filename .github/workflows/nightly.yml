# Every night: hermretro against the newest Hermes (main), so a Hermes change that breaks installs, the scanner
# verdict or registration is noticed before users update; and the real-engine tier on Linux, Apple Silicon
# and Intel macOS. A failed scheduled night opens (or comments on) the issue "Nightly failed", labelled ci.
# Schedules test dev; a manual run tests the dispatched commit. Pull requests that change the workflow test their
# merge commit. Only the Sunday schedule bypasses the toolchain cache, on every system.

name: Nightly

on:
  schedule:
    - cron: "17 10 * * 1-6"
    - cron: "17 10 * * 0"
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/nightly.yml
      - .github/workflows/integration.yml
      - .github/actions/**

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event_name == 'schedule' && 'scheduled' || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  latest-hermes:
    name: Newest Hermes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.event_name == 'workflow_dispatch' && github.sha || '' }}
          fetch-depth: 0  # both the release history and origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: ./.github/actions/hermes
        with:
          ref: main
      - name: hermes plugins validate
        run: '"$HERMES_RUNTIME_PY" -I -m hermes_cli.main plugins validate .'
      - name: hermes plugins validate (the agent side, as in the hermretro profile)
        env:
          HERMRETRO_EVERY_PROFILE: "1"
        run: |
          "$HERMES_RUNTIME_PY" -I -m hermes_cli.main plugins validate . 2>&1 | tee "$RUNNER_TEMP/validate.log"
          if grep -qE "register\(\) did not|declared (tools|hooks) .*(undeclared|not)" "$RUNNER_TEMP/validate.log"; then
            echo "FIX: plugin.yaml provides_tools / provides_hooks must match what __init__.register adds"
            exit 1
          fi
      - name: python tools/ci/hermes_api_check.py
        run: '"$HERMES_RUNTIME_PY" -I tools/ci/hermes_api_check.py'
      # The Build page's untitled session.create on this Hermes: fresh, empty, on the picked model and provider.
      - name: python tools/ci/build_session_check.py
        run: '"$HERMES_RUNTIME_PY" -I tools/ci/build_session_check.py'
      - name: python tools/check.py scan (newest scanner)
        run: python3 tools/check.py scan --strict --hermes-source "$HERMES_SOURCE"
      - name: python tools/ci/clean_install_check.py
        run: python3 tools/ci/clean_install_check.py --hermes-python "$HERMES_RUNTIME_PY"
      - name: python tools/ci/clean_install_check.py --update-from
        if: github.event_name != 'workflow_dispatch'
        run: python3 tools/ci/clean_install_check.py --hermes-python "$HERMES_RUNTIME_PY" --update-from
      - name: Upgrade from the release before this commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 -I tools/ci/published_baseline.py)
          python3 tools/ci/clean_install_check.py --hermes-python "$HERMES_RUNTIME_PY" --update-from "$baseline"

  integration:
    name: Integration
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ github.event_name == 'schedule' && 'dev' || github.event_name == 'workflow_dispatch' && github.sha || '' }}
      systems: '["ubuntu-latest", "macos-latest", "macos-15-intel"]'
      # Sunday proves the pinned downloads still exist; routine runs use the same acceptance with a warm cache.
      restore: ${{ github.event_name != 'schedule' || github.event.schedule != '17 10 * * 0' }}

  checks:
    name: Unit, bundle, lint and page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.event_name == 'workflow_dispatch' && github.sha || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            tools/npm/package-lock.json
            tools/engine/npm/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned dev tools
        run: |
          npm ci --prefix tools/npm --ignore-scripts --no-audit --no-fund
          # The engine's build tools (the engine check and tests/repo/test_engine_bundle.py), where the checked-out commit has them.
          if [ -f tools/engine/npm/package-lock.json ]; then
            npm ci --prefix tools/engine/npm --ignore-scripts --no-audit --no-fund
          fi
          python tools/py/setup.py
      - name: python tools/check.py unit bundle engine lint page
        run: python tools/check.py unit bundle engine lint page --strict

  report:
    name: Report a failed night
    needs: [latest-hermes, integration, checks]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the "Nightly failed" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --label ci --state open --search 'in:title "Nightly failed"' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Nightly failed" --label ci --body "The nightly run failed: $RUN_URL
          Read it with gh run view --log-failed, fix it in a pull request into dev, then close this issue."
          fi
