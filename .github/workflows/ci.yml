# hermretro's checks. The only required check is "All checks pass" (all-checks-pass), which sums up the
# others, so jobs can be added, split or skipped without touching the repository rules. The integration tier
# (real engine) runs for pull requests that touch the backend, engine, player or toolchain, and on every push to
# dev and main. Every check here is
# also `python tools/check.py <name>` locally: fix a failure there, using the FIX: line it prints.
#
# Safety: this workflow runs code from pull requests (forks included), so it uses no secrets, its token
# can only read, and every action is pinned to a full commit SHA (the repository requires it).

name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The oldest Hermes this plugin supports (plugin.yaml requires_hermes), v0.23.1. Its install scanner and
  # validator decide whether users can install a commit.
  HERMES_REF: 3b421578588243f920886e6fe79a6faa87ea026e

jobs:
  base:
    name: Pull request targets dev
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Pull requests go to dev; main moves only at a release
        if: github.event_name == 'pull_request' && github.base_ref != 'dev'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          echo "::error::This pull request targets ${BASE}. FIX: edit the pull request and change its base branch to dev."
          exit 1

  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Linux and macOS (Apple Silicon and Intel) are equally required: hermretro must behave the same on both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
          - { os: macos-15-intel, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Node.js lets the unit tests start a real broker (tests/test_host_os.py) on each system.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: python tools/check.py unit
        run: python tools/check.py unit --strict

  page:
    name: Page bundle and page tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/dev/package-lock.json
      - name: Install the pinned dev tools
        run: npm ci --prefix tools/dev --ignore-scripts --no-audit --no-fund
      - name: python tools/check.py bundle page
        run: python3 tools/check.py bundle page --strict

  scan:
    name: Install scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Hermes's install scanner
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/hermes"
          git -C "$RUNNER_TEMP/hermes" fetch -q --depth=1 https://github.com/NousResearch/hermes-agent.git "$HERMES_REF"
          git -C "$RUNNER_TEMP/hermes" checkout -q --detach FETCH_HEAD
      - name: python tools/check.py scan
        run: python3 tools/check.py scan --strict --hermes-source "$RUNNER_TEMP/hermes"

  validate:
    name: Hermes validation and a clean install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: ./.github/actions/hermes
        with:
          ref: ${{ env.HERMES_REF }}
      - name: hermes plugins validate
        run: '"$HERMES_RUNTIME_PY" -I -m hermes_cli.main plugins validate .'
      - name: python tools/hermes_api_check.py
        run: '"$HERMES_RUNTIME_PY" -I tools/hermes_api_check.py'
      - name: python tools/clean_install_check.py
        run: python3 tools/clean_install_check.py --hermes-python "$HERMES_RUNTIME_PY"

  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Does this touch the backend, the engine or the toolchain?
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "engine=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A pull request's checkout is its merge commit: the first parent is the base.
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(adapter/|engine/|schemas/|release/|player/|tests/acceptance/|__init__\.py$|plugin\.yaml$|tools/(check|prepare_toolchain)\.py$|\.github/|tools/hermes_runtime\.py$|profile/)'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: Integration
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    uses: ./.github/workflows/integration.yml

  all-checks-pass:
    name: All checks pass
    if: always()
    needs: [base, unit, page, scan, validate, changes, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every check passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
