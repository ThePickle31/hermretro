# hermretro's checks. The only required check is "All checks pass" (all-checks-pass), which sums up the
# others, so jobs can be added, split or skipped without touching the repository rules. The integration tier
# (real engine) runs for pull requests that touch the backend, engine, player or toolchain, and on every push to
# dev, except a change of only plugin.yaml's version line (job `changes`). The same job picks the page job's
# scaffold mode (nested or the smoke) and whether job update-dev runs; when it fails, so does this.
# main is not built: it only ever fast-forwards to a dev commit whose push run is green already (release publish
# checks it), and the main rule reads that same commit's checks. Every check here is also
# `python tools/check.py <name>` locally: fix a failure there, using the FIX: line it prints.
#
# Safety: this workflow runs code from pull requests (forks included), so it uses no secrets, its token
# can only read, and every action is pinned to a full commit SHA (the repository requires it).

name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests: a new push cancels the old run. Pushes: one group per commit, so every dev commit gets a
  # finished run (a release needs a green dev commit).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The oldest Hermes this plugin supports (plugin.yaml requires_hermes), v0.23.1. Its install scanner and
  # validator decide whether users can install a commit.
  HERMES_REF: 3b421578588243f920886e6fe79a6faa87ea026e

jobs:
  base:
    name: Pull request targets dev
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Pull requests go to dev; main moves only at a release
        if: github.event_name == 'pull_request' && github.base_ref != 'dev'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          echo "::error::This pull request targets ${BASE}. FIX: edit the pull request and change its base branch to dev."
          exit 1

  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Linux and macOS (Apple Silicon and Intel) are equally required: hermretro must behave the same on both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
          - { os: macos-15-intel, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Node.js lets the unit tests start a real broker (tests/backend/broker/test_broker_socket.py) on each system.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Unit tests (plugin and repository only)
        if: github.event_name == 'pull_request' && matrix.os == 'macos-15-intel'
        run: python tools/check.py unit --strict --unit-product-only
      - name: Unit tests (full suite)
        if: github.event_name != 'pull_request' || matrix.os != 'macos-15-intel'
        run: python tools/check.py unit --strict

  page:
    name: Lint, page bundle and page tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/npm/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/py/requirements.txt
      - name: Install the pinned dev tools
        run: |
          npm ci --prefix tools/npm --ignore-scripts --no-audit --no-fund
          python tools/py/setup.py
      - name: python tools/check.py bundle lint page scaffold
        # nested (every push, and pull requests that change what retrodev new is, reads or is judged by: job
        # `changes`): every new kind also on the real features and pages, then the full unit and page suites.
        # smoke (other pull requests): the guard test alone, every new kind with its focused checks. No decision
        # fails here.
        env:
          SCAFFOLD: ${{ needs.changes.outputs.scaffold }}
        run: |
          case "$SCAFFOLD" in
            true) export RD_SCAFFOLD_FULL=nested ;;
            false) export RD_SCAFFOLD_FULL=smoke ;;
            *) echo "::error::job changes decided no scaffold mode ('$SCAFFOLD'). FIX: read its log; tools/ci/changes.py must print scaffold=true or scaffold=false"; exit 1 ;;
          esac
          echo "RD_SCAFFOLD_FULL=$RD_SCAFFOLD_FULL"
          python tools/check.py bundle lint page scaffold --strict

  scan:
    name: Install scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Hermes's install scanner
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/hermes"
          git -C "$RUNNER_TEMP/hermes" fetch -q --depth=1 https://github.com/NousResearch/hermes-agent.git "$HERMES_REF"
          git -C "$RUNNER_TEMP/hermes" checkout -q --detach FETCH_HEAD
      - name: python tools/check.py scan
        run: python3 tools/check.py scan --strict --hermes-source "$RUNNER_TEMP/hermes"

  # The install checks run as parallel jobs, each with its own Hermes: validate and the clean install, the update
  # from the newest release, and (when job `changes` asks) the update from the dev base.
  validate:
    name: Hermes validation and a clean install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the whole history, as before the update checks moved to their own jobs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: ./.github/actions/hermes
        with:
          ref: ${{ env.HERMES_REF }}
      - name: hermes plugins validate
        run: '"$HERMES_RUNTIME_PY" -I -m hermes_cli.main plugins validate .'
      - name: hermes plugins validate (the agent side, as in the hermretro profile)
        env:
          HERMRETRO_EVERY_PROFILE: "1"
        run: |
          "$HERMES_RUNTIME_PY" -I -m hermes_cli.main plugins validate . 2>&1 | tee "$RUNNER_TEMP/validate.log"
          if grep -qE "register\(\) did not|declared (tools|hooks) .*(undeclared|not)" "$RUNNER_TEMP/validate.log"; then
            echo "FIX: plugin.yaml provides_tools / provides_hooks must match what __init__.register adds"
            exit 1
          fi
      - name: python tools/ci/hermes_api_check.py
        run: '"$HERMES_RUNTIME_PY" -I tools/ci/hermes_api_check.py'
      # The Build page's untitled session.create on this Hermes: fresh, empty, on the picked model and provider.
      - name: python tools/ci/build_session_check.py
        run: '"$HERMES_RUNTIME_PY" -I tools/ci/build_session_check.py'
      - name: python tools/ci/clean_install_check.py
        run: python3 tools/ci/clean_install_check.py --hermes-python "$HERMES_RUNTIME_PY"

  update:
    name: Update from the newest release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # every tag and origin/main: the update check installs the newest release first
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: ./.github/actions/hermes
        with:
          ref: ${{ env.HERMES_REF }}
      # Installs the newest v* release on origin/main, uses it, then `hermes plugins update`s it to this commit.
      - name: python tools/ci/clean_install_check.py --update-from
        run: python3 tools/ci/clean_install_check.py --hermes-python "$HERMES_RUNTIME_PY" --update-from

  update-dev:
    name: Update from the tested dev base
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.upgrade != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # every tag and origin/main: the update check installs the newest release first
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: ./.github/actions/hermes
        with:
          ref: ${{ env.HERMES_REF }}
      # Use the PR merge commit's first parent: a moving origin/dev may not be an ancestor of this checkout.
      - name: python tools/ci/clean_install_check.py --update-from HEAD^1
        run: python3 tools/ci/clean_install_check.py --hermes-python "$HERMES_RUNTIME_PY" --update-from HEAD^1

  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
      scaffold: ${{ steps.diff.outputs.scaffold }}
      upgrade: ${{ steps.diff.outputs.upgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Does this need the real engine, the nested scaffold run or the update from dev?
        id: diff
        shell: bash
        # tools/ci/changes.py decides (its paths, and why a change of only plugin.yaml's version line skips the
        # real-engine run). A pull request's checkout is its merge commit: the first parent is the base. A push is
        # judged only when it pushed one commit (before is HEAD's parent); any other push runs everything.
        env:
          BEFORE: ${{ github.event.before }}
        # Every decision must be there, true or false, or this job fails (and with it All checks pass).
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            said=$(python3 tools/ci/changes.py HEAD^1 HEAD)
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$BEFORE" = "$(git rev-parse -q --verify HEAD^1 || true)" ]; then
            said=$(python3 tools/ci/changes.py --push "$BEFORE" HEAD)
          else
            said=$(printf 'engine=true\nscaffold=true\nupgrade=true')
          fi
          echo "$said"
          values='(true|false)'
          format="^engine=$values"$'\n'"scaffold=$values"$'\n'"upgrade=$values"'$'
          if ! [[ "$said" =~ $format ]]; then
            echo "::error::Invalid CI check selection. FIX: tools/ci/changes.py must print engine, scaffold and upgrade once, in order, each true or false"
            exit 1
          fi
          printf '%s\n' "$said" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    uses: ./.github/workflows/integration.yml

  all-checks-pass:
    name: All checks pass
    if: always()
    needs: [base, unit, page, scan, validate, update, update-dev, changes, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every check passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
