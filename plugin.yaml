name: hermretro
version: 0.0.7
manifest_version: 2
description: Plan, build, playtest and ship Game Boy Color games for the ModRetro Chromatic
author: hermretro contributors
license: MIT
homepage: https://github.com/ThePickle31/hermretro
tags: [game-development, gameboy, gb-studio, modretro, chromatic, desktop]
requires_hermes: ">=0.23.1"
external_dependencies:
  - name: node
    check: "node --version"
    install: "Install Node.js 22 or newer from https://nodejs.org/"
config_schema:
  hardware_enabled:
    type: bool
    default: false
    label: Chromatic hardware tools
    description: >-
      Allow device discovery, driver setup, streaming to a connected Chromatic, physical capture and
      cartridge flashing. Off by default. Flashing, streaming and driver setup go through Hermes's
      approval prompt; if you have turned Approvals off in Hermes, they run without asking.
      Developer Mode activation always happens in ModRetro's own Updater.
  live_player:
    type: bool
    default: true
    label: Keep the playable copy current
    description: >-
      After every successful build, also refresh the game's playable copy, the one the Chromatic
      Studio emulator plays. Hermes can then show you the newest build when it is ready to try, and
      an emulator you already have open can load it. Adds a few seconds to each build. Loading a
      new build restarts the game in the player.
provides_hooks:
  - pre_tool_call
  - subagent_start
  - subagent_stop
  - pre_llm_call
  - post_llm_call
  - post_tool_call
provides_tools:
  - chromatic_studio_device_cli
  - chromatic_present_game
  - chromatic_game_info
  - chromatic_build_report
  - chromatic_session_status
